[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-agent"
version = "0.1.0"
description = "Veles — a general-purpose AI coding agent framework powered by Fable-5. Orchestrator + sub-agents, tooling suite, persistent memory, pluggable domain playbooks, and an MCP server for interop with any AI coding agent. Use it for business analytics, game development, research, infrastructure, creative coding, or any domain."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hunter Hughes" }]
keywords = ["ai", "agent", "coding-agent", "mcp", "llm", "orchestrator", "fable-5", "veles", "general-purpose", "game-development"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[project.scripts]
fable = "fable_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Hunterhghs/Fable-5"
Repository = "https://github.com/Hunterhghs/Fable-5.git"

[tool.setuptools.packages.find]
include = ["fable_agent*"]

[tool.setuptools.package-data]
fable_agent = ["prompts/*.md", "playbooks/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
