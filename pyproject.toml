[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fable-agent"
version = "0.1.0"
description = "An open-source, extensible AI coding agent framework: orchestrator + sub-agents, tooling suite, persistent memory, and an MCP server for interop with other AI coding agents."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
authors = [{ name = "Hunter Hughes" }]
keywords = ["ai", "agent", "coding-agent", "mcp", "llm", "orchestrator"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development",
]
dependencies = [
    "httpx>=0.27",
]

[project.optional-dependencies]
mcp = ["mcp>=1.2.0"]
dev = ["pytest>=8.0", "mcp>=1.2.0"]

[project.scripts]
fable = "fable_agent.cli:main"

[project.urls]
Homepage = "https://github.com/Hunterhghs/Fable-5"
Repository = "https://github.com/Hunterhghs/Fable-5.git"

[tool.setuptools.packages.find]
include = ["fable_agent*"]

[tool.setuptools.package-data]
fable_agent = ["prompts/*.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
